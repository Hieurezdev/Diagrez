minimum_pre_commit_version: "3.5.0"

default_language_version:
  python: python3.12

default_stages: [pre-commit]

repos:
  # 1) Format + Lint
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.12.12
    hooks:
      - id: ruff-format
        name: ruff-format
        types: [python]
        exclude: |
          (^migrations/)|(^data/)|(^build/)|(^dist/)|(^.venv/)|(^venv/)|(^logs/)
      - id: ruff
        name: ruff
        args: ["--fix"]
        types: [python]
        exclude: |
          (^migrations/)|(^data/)|(^build/)|(^dist/)|(^.venv/)|(^venv/)|(^logs/)

  # 2) Hooks vệ sinh cơ bản
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      - id: end-of-file-fixer
      - id: trailing-whitespace
      - id: check-merge-conflict
      - id: check-yaml
      - id: check-toml
      - id: check-json
      - id: mixed-line-ending

  # 3) Secret scanning (pre-push)
  - repo: https://github.com/Yelp/detect-secrets
    rev: v1.5.0
    hooks:
      - id: detect-secrets
        stages: [pre-push]
        exclude: |
          (^tests?/fixtures/)|(^data/)|(^assets/)

  # 4) Type-check & test (pre-push)
  - repo: local
    hooks:
      - id: mypy
        name: mypy (pre-push)
        entry: .venv/bin/mypy --pretty --cache-dir=.mypy_cache core main.py
        language: system
        pass_filenames: false
        stages: [pre-push]
        types: [python]
      - id: pytest
        name: pytest (quick, pre-push)
        entry: env UV_CACHE_DIR=.uv-cache uv run pytest -q tests
        language: system
        pass_filenames: false
        stages: [pre-push]
        types: [python]
